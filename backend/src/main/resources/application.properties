spring.application.name=hackmate-backend
server.port=8080

# --- Database (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hackmate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JSON: dates as ISO strings ("2026-10-19T10:00:00"), not arrays/timestamps ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- JWT (secret must be Base64, at least 256 bits; override with JWT_SECRET) ---
jwt.secret=${JWT_SECRET:aGFja21hdGUtc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjAyNi1jb2xsZWdlLXByb2plY3Q=}
# 24 hours in milliseconds
jwt.expiration-ms=86400000
