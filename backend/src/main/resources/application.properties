spring.application.name=hackmate-backend
server.port=8080

# --- Database (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hackmate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JSON: dates as ISO strings ("2026-10-19T10:00:00"), not arrays/timestamps ---
spring.jackson.serialization.write-dates-as-timestamps=false

# --- JWT ---
# Set JWT_SECRET to a Base64 key of at least 256 bits (e.g. `openssl rand -base64 32`).
# If it is not set, a random key is generated at startup (tokens then stop working after a restart).
jwt.secret=${JWT_SECRET:}
# 24 hours in milliseconds
jwt.expiration-ms=86400000
